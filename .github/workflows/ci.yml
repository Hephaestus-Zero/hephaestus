name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev pkg-config

      - name: Shell syntax check (install.sh)
        run: sh -n install.sh

      - name: Build and test with -O2 -Wall -Wextra -Werror
        run: |
          make clean
          make test CFLAGS="-std=c11 -O2 -Wall -Wextra -Werror"

      - name: Verify -O3 -Werror build and dist packaging (full & partial ORGANS)
        run: |
          make clean
          make dist CFLAGS="-std=c11 -O3 -Wall -Wextra -Werror"
          make clean
          make dist ORGANS="slice verify" CFLAGS="-std=c11 -O3 -Wall -Wextra -Werror"

  asan-ubsan:
    name: ASan + UBSan (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev pkg-config

      - name: Build and test with ASan + UBSan + -Werror
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          make clean
          make test CFLAGS="-std=c11 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -Wall -Wextra -Werror"
